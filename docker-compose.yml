x-logging: &default-logging
  # The default json-file driver grows without bound and can fill the host disk.
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-mcq_app}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 3s
      retries: 5
    logging: *default-logging
    mem_limit: 512m

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      # +psycopg selects psycopg3, which SQLAlchemy uses for both the app's async
      # engine and the entrypoint's sync one.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-mcq_app}
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env}
      AUTH_INVITE_CODE: ${AUTH_INVITE_CODE:?set AUTH_INVITE_CODE in .env}
      # Read only by Alembic revision 0002, which creates the first instructor.
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:?set BOOTSTRAP_ADMIN_EMAIL in .env}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?set BOOTSTRAP_ADMIN_PASSWORD in .env}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-3}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      # Loopback only — public traffic reaches the API through caddy -> frontend.
      # Kept published so test_e2e.py and debugging can hit it directly.
      - "127.0.0.1:8001:8000"
    volumes:
      - uploads:/app/uploads
      # Course PDFs/HTML used to live only in the image layer and were destroyed
      # on every rebuild.
      - docs:/app/Docs
    depends_on:
      db:
        condition: service_healthy
    logging: *default-logging
    mem_limit: 1g

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:4200:80"
    depends_on:
      backend:
        condition: service_healthy
    logging: *default-logging
    mem_limit: 256m

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?set APP_DOMAIN in .env (use :80 for plain local HTTP)}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
    logging: *default-logging
    mem_limit: 256m

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy
    # Daily dump, 14 days retained. Restore with:
    #   gunzip -c backups/<file>.sql.gz | docker compose exec -T db psql -U postgres mcq_app
    command: >
      sh -c 'while true; do
        f=/backups/mcq_app_$$(date +%Y%m%d_%H%M%S).sql.gz;
        pg_dump -h db -U ${POSTGRES_USER:-postgres} ${POSTGRES_DB:-mcq_app} | gzip > $$f
          && echo "backup written: $$f"
          || echo "BACKUP FAILED";
        find /backups -name "mcq_app_*.sql.gz" -mtime +14 -delete;
        sleep 86400;
      done'
    logging: *default-logging
    mem_limit: 256m

volumes:
  pgdata:
  uploads:
  docs:
  caddy_data:
  caddy_config:
