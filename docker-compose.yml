x-logging: &default-logging
  # The default json-file driver grows without bound and can fill the host disk.
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

networks:
  # The internet-facing proxy can reach the SPA and nothing else; only the
  # backend and the backup sidecar can reach Postgres.
  edge:
  app:
  data:
    internal: true

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-mcq_app}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 3s
      retries: 5
    logging: *default-logging
    mem_limit: 512m

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      # +psycopg selects psycopg3, which SQLAlchemy uses for both the app's async
      # engine and the entrypoint's sync one.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-mcq_app}
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env}
      # Gates instructor sign-ups only. Students register with their instructor's
      # personal code, which is minted at that instructor's sign-up.
      AUTH_INSTRUCTOR_INVITE_CODE: ${AUTH_INSTRUCTOR_INVITE_CODE:?set AUTH_INSTRUCTOR_INVITE_CODE in .env}
      # Read once, by Alembic revision 0002, to create the first instructor.
      # Optional on purpose: once that revision has run, blank both in .env so the
      # standing instructor password stops living in the container environment
      # (visible via `docker inspect` and /proc/1/environ). Change the password in
      # the app first — POST /api/auth/password, which also revokes every token.
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-3}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      # Loopback only — public traffic reaches the API through caddy -> frontend.
      # Kept published so test_e2e.py and debugging can hit it directly.
      - "127.0.0.1:8001:8000"
    networks: [app, data]
    volumes:
      - uploads:/app/uploads
      # Course PDFs/HTML used to live only in the image layer and were destroyed
      # on every rebuild.
      - docs:/app/Docs
    depends_on:
      db:
        condition: service_healthy
    logging: *default-logging
    mem_limit: 1g

  frontend:
    build: ./frontend
    restart: unless-stopped
    networks: [edge, app]
    depends_on:
      backend:
        condition: service_healthy
    logging: *default-logging
    mem_limit: 256m

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?set APP_DOMAIN in .env (use :80 for plain local HTTP)}
      ACME_EMAIL: ${ACME_EMAIL:-}
    networks: [edge]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *default-logging
    mem_limit: 256m

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    # Not root: the default entrypoint only drops privilege when the command is
    # `postgres`, so a bare `sh -c` would run as uid 0 and write world-readable
    # dumps of every password hash and answer key to the host.
    user: "70:70"
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    networks: [data]
    volumes:
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy
    # Daily dump, 14 days retained. Restore with:
    #   gunzip -c backups/<file>.sql.gz | docker compose exec -T db psql -U postgres mcq_app
    #
    # pipefail is load-bearing: a shell pipeline exits with the status of its
    # LAST command, so without it a failed pg_dump still produced a valid empty
    # .gz, logged success, and the prune below then deleted the good backups.
    # The prune only runs after a dump has been verified.
    command: >
      sh -c 'umask 077; set -o pipefail; while true; do
        f=/backups/mcq_app_$$(date +%Y%m%d_%H%M%S).sql.gz;
        if pg_dump -h db -U ${POSTGRES_USER:-postgres} ${POSTGRES_DB:-mcq_app} | gzip > $$f
           && gzip -t $$f
           && [ "$$(stat -c%s $$f)" -gt 1000 ]; then
          echo "backup ok: $$f ($$(stat -c%s $$f) bytes)";
          find /backups -name "mcq_app_*.sql.gz" -mtime +14 -delete;
        else
          echo "BACKUP FAILED - keeping existing backups, not pruning";
          rm -f $$f;
        fi;
        sleep 86400;
      done'
    logging: *default-logging
    mem_limit: 256m

volumes:
  pgdata:
  uploads:
  docs:
  caddy_data:
  caddy_config:
