# This file is included from nginx's http{} block (conf.d/default.conf), which is
# why limit_req_zone can live here — it is not valid inside server{}.
#
# Keyed on the real client address, which requires the real_ip directives in the
# server block below: nginx's actual peer is always the Caddy container, so
# without them every request in the system shares one bucket and a single script
# can 503 everybody's login.
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # Caddy is the only thing that may reach this container, and it appends to
    # any client-supplied XFF — so trust the bridge range and walk right-to-left
    # rather than taking the leftmost (spoofable) value.
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 10.0.0.0/8;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Exam JSON uploads carry every question in one body; nginx's 1 MB default
    # rejected real case-study exams with an opaque HTML 413.
    client_max_body_size 12m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    # nginx >= 1.21.1 maps .js to text/javascript — without it the JS bundles ship unzipped.
    gzip_types text/plain text/css text/javascript application/javascript application/json
               application/xml image/svg+xml font/woff font/woff2;

    # Docker's embedded DNS, re-resolved so recreating the backend container does
    # not leave nginx pinned to a dead IP (permanent 502s).
    resolver 127.0.0.11 valid=30s ipv6=off;

    # NOTE: add_header does not merge — a location that sets any header of its own
    # discards every inherited one. proxy-common.conf sets no add_header, so the
    # proxy locations below inherit these; the three that add Cache-Control
    # re-include the file explicitly.
    include /etc/nginx/security-headers.conf;

    # Every proxy_pass below is deliberately WITHOUT a URI. When proxy_pass
    # contains a variable (needed for `resolver` re-resolution), nginx does not
    # do the usual prefix substitution — a URI would *replace* the request URI,
    # so `proxy_pass $backend/api/;` sent every call to the backend as "/api/".
    # With no URI, the original request URI is passed through verbatim.

    location = /api/auth/login {
        limit_req zone=login burst=5 nodelay;
        set $backend http://backend:8000;
        proxy_pass $backend;
        include /etc/nginx/proxy-common.conf;
    }

    location = /api/auth/register {
        limit_req zone=login burst=5 nodelay;
        set $backend http://backend:8000;
        proxy_pass $backend;
        include /etc/nginx/proxy-common.conf;
    }

    # ^~ stops the regex location further down from claiming these. Without it,
    # /api/uploads/q1_abc.png matches the static-asset regex and is served from
    # the SPA root — a 404 that never reaches the auth middleware.
    location ^~ /api/ {
        limit_req zone=api burst=40 nodelay;
        set $backend http://backend:8000;
        proxy_pass $backend;
        include /etc/nginx/proxy-common.conf;
    }

    location ^~ /docs-files/ {
        limit_req zone=api burst=40 nodelay;
        set $backend http://backend:8000;
        proxy_pass $backend;
        include /etc/nginx/proxy-common.conf;
    }

    # Hashed filenames (outputHashing: all) — safe to cache forever.
    location ~* \.(?:js|css|woff2?|png|jpe?g|gif|webp|svg|ico)$ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # index.html must never be cached: a stale copy asks for bundle hashes that no
    # longer exist, and the SPA fallback would answer those with a 200.
    location = /index.html {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
