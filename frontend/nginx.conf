# This file is included from nginx's http{} block (conf.d/default.conf), which is
# why limit_req_zone can live here — it is not valid inside server{}.
#
# Throttles credential stuffing. 5 r/s per IP with a small burst is invisible to
# a human and useless to a script.
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/s;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # Exam JSON uploads carry every question in one body; nginx's 1 MB default
    # rejected real case-study exams with an opaque HTML 413.
    client_max_body_size 12m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json
               application/xml image/svg+xml font/woff font/woff2;

    # Docker's embedded DNS, re-resolved so recreating the backend container does
    # not leave nginx pinned to a dead IP (permanent 502s).
    resolver 127.0.0.11 valid=30s ipv6=off;

    # NOTE: add_header does not merge — a location that sets any header of its own
    # discards every inherited one. Hence the include in each location below.
    include /etc/nginx/security-headers.conf;

    location = /api/auth/login {
        limit_req zone=login burst=5 nodelay;
        set $backend http://backend:8000;
        proxy_pass $backend/api/auth/login;
        include /etc/nginx/proxy-common.conf;
    }

    location = /api/auth/register {
        limit_req zone=login burst=5 nodelay;
        set $backend http://backend:8000;
        proxy_pass $backend/api/auth/register;
        include /etc/nginx/proxy-common.conf;
    }

    location /api/ {
        set $backend http://backend:8000;
        proxy_pass $backend/api/;
        include /etc/nginx/proxy-common.conf;
    }

    location /docs-files/ {
        set $backend http://backend:8000;
        proxy_pass $backend/docs-files/;
        include /etc/nginx/proxy-common.conf;
    }

    # Hashed filenames (outputHashing: all) — safe to cache forever.
    location ~* \.(?:js|css|woff2?|png|jpe?g|gif|webp|svg|ico)$ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # index.html must never be cached: a stale copy asks for bundle hashes that no
    # longer exist, and the SPA fallback would answer those with a 200.
    location = /index.html {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
