[pytest]
testpaths = tests
asyncio_mode = auto
# Pin the loop scope explicitly: the default is a deprecation warning in
# pytest-asyncio 0.24+ and an error in 1.x.
asyncio_default_fixture_loop_scope = function
filterwarnings =
    # A forgotten `await` on a session method is the single largest data-loss
    # risk in the async codebase, and it only ever shows up as this warning.
    error::RuntimeWarning
